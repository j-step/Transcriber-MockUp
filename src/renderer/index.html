<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Transcriber Mockup</title>
    <style>
      body {
        font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
        display: flex;
        min-height: 100vh;
        margin: 0;
        background: #f5f6f8;
        color: #1a1a1a;
        align-items: center;
        justify-content: center;
      }

      .panel {
        background: white;
        padding: 2.5rem 3rem;
        border-radius: 16px;
        box-shadow: 0 8px 24px rgba(15, 23, 42, 0.12);
        text-align: center;
        max-width: 420px;
      }

      button {
        margin-top: 1.5rem;
        padding: 0.75rem 1.5rem;
        border: none;
        border-radius: 999px;
        background: #3b82f6;
        color: white;
        font-size: 1rem;
        cursor: pointer;
      }

      button:hover {
        background: #2563eb;
      }
    </style>
  </head>
  <body>
    <main class="panel">
      <h1>Transcriber Mockup</h1>
      <p>Welcome! This is the bare-bones window for the future audio transcription app.</p>
      <button id="close-button" type="button">Close App</button>
    </main>

    <script>
      const button = document.getElementById("close-button");

      button?.addEventListener("click", () => {
        window.electronAPI.closeWindow();
      });
    </script>
  </body>
</html>
